<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6E62">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Zamanında Hatırlatıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: tek sütunlu cep uygulaması — üstte bugünün tarihi, ay takvimi, seçili günün listesi, altta sabit "ekle" düğmesi */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --sunk:#E2E8E6; --ink:#15211F; --muted:#56645F; --line:#D3DCD9;
  --accent:#0E6E62; --accent-ink:#FFFFFF; --accent-soft:#D5EAE5;
  --alert:#B93D0C; --alert-ink:#FFFFFF; --alert-soft:#FAE1D4;
  --done:#7A8885; --shadow:0 10px 30px rgba(16,40,35,.14);
  --f-display:"Bricolage Grotesque", "Atkinson Hyperlegible Next", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
  font-size:17px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17201E; --sunk:#111917; --ink:#E5EEEB; --muted:#98A8A4; --line:#2A3633;
  --accent:#44C2B0; --accent-ink:#04211D; --accent-soft:#16332F;
  --alert:#FF8B57; --alert-ink:#2A0F04; --alert-soft:#3A2115;
  --done:#76847F; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17201E; --sunk:#111917; --ink:#E5EEEB; --muted:#98A8A4; --line:#2A3633;
  --accent:#44C2B0; --accent-ink:#04211D; --accent-soft:#16332F;
  --alert:#FF8B57; --alert-ink:#2A0F04; --alert-soft:#3A2115;
  --done:#76847F; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
:root[data-size="s"]{font-size:15px}
:root[data-size="m"]{font-size:17px}
:root[data-size="l"]{font-size:21px}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:36rem;margin:0 auto;padding-inline:16px;padding-block:14px 7.5rem;display:flex;flex-direction:column;gap:14px}
svg{display:block;flex:none}

/* Üst bölüm */
.top{display:flex;align-items:center;gap:12px}
.today{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.today-day{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.today-wd{font-weight:700;font-size:1.05rem;line-height:1.15}
.today-my{color:var(--muted);font-size:.9rem}
.clock{font-family:var(--f-display);font-weight:600;font-size:1.3rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.icon-btn{width:2.75rem;height:2.75rem;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:1.3rem;height:1.3rem}

/* Uyarı şeritleri */
.banner{display:flex;align-items:center;gap:10px;padding:.7rem .9rem;border-radius:var(--r);font-weight:600}
.banner.warn{background:var(--alert);color:var(--alert-ink);width:100%;text-align:left}
.banner.info{background:var(--accent-soft);color:var(--ink);font-weight:400;font-size:.92rem;flex-wrap:wrap}
.banner .grow{flex:1;min-width:0}
.banner svg{width:1.25rem;height:1.25rem}
.linkbtn{font-weight:700;color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.banner.warn .linkbtn{color:inherit}

/* Sekmeler */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:999px;padding:4px;gap:4px}
.seg button{padding:.55rem .5rem;border-radius:999px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Takvim */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.cal-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em}
.nav-btn{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.nav-btn svg{width:1.1rem;height:1.1rem}
.pill-btn{padding:.4rem .8rem;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-block:4px}
.wd.we{color:var(--alert)}
.cell{aspect-ratio:1/1.02;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.cell .n{font-weight:600;font-size:1rem;line-height:1}
.cell.out .n{color:var(--muted);opacity:.5}
.cell.today .n{color:var(--accent);font-weight:800}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel{background:var(--accent);box-shadow:none}
.cell.sel .n{color:var(--accent-ink)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.dot.overdue{background:var(--alert)}
.dot.done{background:var(--done)}
.cell.sel .dot{background:var(--accent-ink)}
.cell.sel .dot.overdue{background:var(--alert-soft)}

/* Liste */
.section-h{display:flex;align-items:baseline;gap:8px;margin:.3rem 2px .4rem}
.section-h h3{margin:0;font-size:1.05rem;font-weight:700}
.section-h .sub{color:var(--muted);font-size:.88rem}
.badge{font-size:.75rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.badge.alert{background:var(--alert-soft);color:var(--alert)}
.items{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:stretch;gap:8px;padding-inline:12px 10px;border-top:1px solid var(--line);position:relative}
.item:first-child{border-top:0}
.item.st-overdue::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--alert)}
.item-main{flex:1;min-width:0;display:flex;gap:12px;text-align:left;padding-block:.8rem}
.when{flex:none;width:3.4rem;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
.when .t{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.1}
.when .d{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.st-overdue .when .t{color:var(--alert)}
.body{min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-weight:700;overflow-wrap:anywhere}
.st-done .title{text-decoration:line-through;color:var(--done);font-weight:600}
.note{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:.08rem .45rem;border-radius:6px;background:var(--sunk);font-weight:600}
.tag svg{width:.85rem;height:.85rem}
.tag.alert{background:var(--alert-soft);color:var(--alert)}
.tag.ok{background:var(--accent-soft);color:var(--accent)}
.check{align-self:center;flex:none;display:inline-flex;align-items:center;gap:6px;padding:.5rem .8rem;border-radius:999px;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-size:.9rem}
.check svg{width:1rem;height:1rem}
.st-overdue .check{background:var(--alert);border-color:var(--alert);color:var(--alert-ink)}
.done-mark{align-self:center;color:var(--done);width:1.6rem;height:1.6rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:1.2rem;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.6rem}
.empty strong{color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:14px}

/* Ekle düğmesi */
.fab-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;justify-content:center;pointer-events:none;z-index:5}
.fab{pointer-events:auto;width:100%;max-width:34rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:1rem;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;box-shadow:var(--shadow)}
.fab svg{width:1.3rem;height:1.3rem}

/* Alt sayfa (form ve ayarlar) */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(5,15,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:36rem;max-height:92%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:center;gap:10px}
.sheet-h h2{flex:1;margin:0;font-family:var(--f-display);font-weight:800;font-size:1.4rem}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:700;font-size:.9rem}
.hint{color:var(--muted);font-size:.85rem}
.inp{width:100%;padding:.75rem .85rem;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:1rem;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
textarea.inp{min-height:4.5rem;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:.45rem .8rem;border-radius:999px;background:var(--sunk);font-weight:600;font-size:.88rem}
.opt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.opt button{padding:.65rem .3rem;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:.92rem}
.opt button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;padding:.85rem 1rem;border-radius:14px;font-weight:700;text-align:center;min-width:8rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk)}
.btn.danger{color:var(--alert);border:1.5px solid var(--alert)}
.btn.danger.armed{background:var(--alert);color:var(--alert-ink)}
.err{color:var(--alert);font-weight:600;font-size:.9rem}
.set-group{display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.set-group:first-of-type{border-top:0;padding-top:0}
.size-prev{display:flex;align-items:baseline;gap:4px;justify-content:center}
.status-line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ok-txt{color:var(--accent);font-weight:700}
.bad-txt{color:var(--alert);font-weight:700}

/* Alarm ekranı */
.alarm{position:fixed;inset:0;z-index:40;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:24px 20px calc(24px + env(safe-area-inset-bottom, 0px));text-align:center}
.alarm.overdue{background:var(--alert);color:var(--alert-ink)}
.bell{width:6.5rem;height:6.5rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.16);position:relative}
.bell svg{width:3rem;height:3rem}
.bell::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid currentColor;opacity:.35;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.6}to{transform:scale(1.35);opacity:0}}
.bell svg{animation:shake 1.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes shake{0%,50%,100%{transform:rotate(0)}10%,30%{transform:rotate(-14deg)}20%,40%{transform:rotate(14deg)}}
.alarm .a-time{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.alarm .a-title{font-size:1.6rem;font-weight:700;max-width:30rem;overflow-wrap:anywhere;text-wrap:balance}
.alarm .a-note{opacity:.88;max-width:30rem;overflow-wrap:anywhere}
.alarm .a-meta{font-size:.9rem;opacity:.85}
.alarm-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:24rem}
.a-done{display:flex;align-items:center;justify-content:center;gap:10px;padding:1.15rem;border-radius:18px;background:var(--surface);color:var(--ink);font-weight:800;font-size:1.25rem}
.a-done svg{width:1.6rem;height:1.6rem;color:var(--accent)}
.a-later{padding:.9rem;border-radius:16px;border:2px solid currentColor;font-weight:700;opacity:.9}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.2rem + env(safe-area-inset-bottom, 0px));z-index:30;background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}
@media (prefers-reduced-motion: reduce){.bell::after,.bell svg{animation:none}}
@media (max-width:360px){.when{width:3rem}.check span{display:none}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="today">
      <div class="today-day" id="tDay">–</div>
      <div><div class="today-wd" id="tWd"></div><div class="today-my" id="tMy"></div></div>
    </div>
    <div class="clock" id="clock" aria-label="Saat"></div>
    <button class="icon-btn" data-act="settings" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>
  <div id="banners" class="stack"></div>
  <div class="seg" role="group" aria-label="Görünüm">
    <button data-act="view" data-v="cal" id="vCal">Takvim</button>
    <button data-act="view" data-v="list" id="vList">Liste</button>
  </div>
  <main id="main" class="stack"></main>
</div>

<div class="fab-bar"><button class="fab" data-act="new" id="fab">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Hatırlatma ekle</button></div>

<div class="sheet-wrap" id="sheetWrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="alarm" id="alarm" hidden role="alertdialog" aria-live="assertive"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- sabitler ---------- */
var MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
var WD_LONG=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
var WD_SHORT=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
var REPEAT={none:"Bir kez",daily:"Her gün",weekly:"Her hafta",monthly:"Her ay"};
var KEY="zamaninda.v1", CHANNEL="hatirlatma-alarm", CHAIN=18, MIN=60000;
var ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  checkCircle:'<svg class="done-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6"/></svg>',
  repeat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- platform ---------- */
var Cap=window.Capacitor;
var NATIVE=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
var LN=NATIVE&&Cap.Plugins?Cap.Plugins.LocalNotifications:null;
var PREF=NATIVE&&Cap.Plugins?Cap.Plugins.Preferences:null;

/* ---------- durum ---------- */
var S={reminders:[],settings:{size:"m",interval:10,sound:true},nextNid:1};
var now0=new Date();
var ui={view:"cal",y:now0.getFullYear(),m:now0.getMonth(),sel:dayKey(now0),todayKey:dayKey(now0),
  edit:null,alarmQ:[],alarmId:null,loaded:false,perm:null,exact:null,sheet:null};
var queuedActions=[];

/* ---------- yardımcılar ---------- */
function $(id){return document.getElementById(id)}
function pad(n){return (n<10?"0":"")+n}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dayKey(d){d=new Date(d);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function keyToDate(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function hm(ms){var d=new Date(ms);return pad(d.getHours())+":"+pad(d.getMinutes())}
function startOfDay(d){d=new Date(d);d.setHours(0,0,0,0);return d.getTime()}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36)}
function find(id){for(var i=0;i<S.reminders.length;i++)if(S.reminders[i].id===id)return S.reminders[i];return null}
function dayLabel(ms){
  var diff=Math.round((startOfDay(ms)-startOfDay(Date.now()))/864e5);
  if(diff===0)return "Bugün"; if(diff===1)return "Yarın"; if(diff===-1)return "Dün";
  var d=new Date(ms); return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3);
}
function longDate(ms){var d=new Date(ms);return d.getDate()+" "+MONTHS[d.getMonth()]+" "+WD_LONG[d.getDay()]}
function fullWhen(ms){return dayLabel(ms)+" "+hm(ms)}
function rel(ms){
  var m=Math.round((ms-Date.now())/MIN); if(m<=0)return "şimdi";
  if(m<60)return m+" dk sonra"; var h=Math.floor(m/60),r=m%60;
  if(h<24)return h+" sa"+(r?" "+r+" dk":"")+" sonra"; return null;
}
function nextOcc(ms,rep,anchor){
  var d=new Date(ms);
  if(rep==="daily"){d.setDate(d.getDate()+1);return d.getTime()}
  if(rep==="weekly"){d.setDate(d.getDate()+7);return d.getTime()}
  if(rep==="monthly"){
    var y=d.getFullYear(),m=d.getMonth()+1,dim=new Date(y,m+1,0).getDate();
    return new Date(y,m,Math.min(anchor||d.getDate(),dim),d.getHours(),d.getMinutes()).getTime();
  }
  return null;
}
function intervalMs(){return (S.settings.interval||10)*MIN}

/* ---------- kayıt ---------- */
function load(){
  var done=function(raw){
    if(raw){try{var d=JSON.parse(raw);
      S.reminders=Array.isArray(d.reminders)?d.reminders:[];
      S.nextNid=d.nextNid||S.reminders.length+1;
      for(var k in (d.settings||{}))S.settings[k]=d.settings[k];
    }catch(e){}}
    else if(!NATIVE) seed();
  };
  if(PREF){
    return PREF.get({key:KEY}).then(function(r){
      var raw=r&&r.value; if(!raw){try{raw=localStorage.getItem(KEY)}catch(e){}} done(raw);
    }).catch(function(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}done(raw)});
  }
  var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
  done(raw); return Promise.resolve();
}
function persist(){
  var raw=JSON.stringify(S);
  try{localStorage.setItem(KEY,raw)}catch(e){}
  if(PREF)PREF.set({key:KEY,value:raw}).catch(function(){});
}
function save(){persist();scheduleSync()}

function mk(o){
  var r={id:uid(),nid:S.nextNid++,title:"",note:"",due:Date.now(),repeat:"none",anchorDay:1,
    done:false,doneAt:null,lastAlert:null,history:[],sample:false,created:Date.now()};
  for(var k in o)r[k]=o[k];
  r.anchorDay=new Date(r.due).getDate();
  return r;
}
function seed(){
  var n=Date.now(), round=function(ms){return Math.round(ms/(5*MIN))*5*MIN};
  var at=function(off,h,m){var d=new Date();d.setDate(d.getDate()+off);d.setHours(h,m,0,0);return d.getTime()};
  var sat=((6-new Date().getDay()+7)%7)||7;
  var nm=new Date();nm=new Date(nm.getFullYear(),nm.getMonth()+1,1,10,0).getTime();
  var y1=at(-1,14,0);
  S.reminders=[
    mk({title:"Elektrik faturasını öde",note:"Son ödeme günü bugün",due:round(n-15*MIN),lastAlert:n-3*MIN,sample:true}),
    mk({title:"Çiçekleri sula",due:round(n+2*60*MIN),repeat:"daily",sample:true}),
    mk({title:"Annemi ara",due:at(1,19,0),sample:true}),
    mk({title:"Araç muayenesi",note:"TÜVTÜRK randevusu, ruhsatı yanına al",due:at(5,10,30),sample:true}),
    mk({title:"Haftalık market alışverişi",due:at(sat,11,0),repeat:"weekly",sample:true}),
    mk({title:"Kira ödemesi",due:nm,repeat:"monthly",sample:true}),
    mk({title:"Kargoyu teslim al",due:y1,done:true,doneAt:y1+20*MIN,history:[{at:y1,doneAt:y1+20*MIN}],sample:true})
  ];
}

/* ---------- oluşumlar (takvimde görünen her tarih) ---------- */
function occurrences(from,to){
  var out=[],n=Date.now();
  S.reminders.forEach(function(r){
    (r.history||[]).forEach(function(h){
      if(h.at>=from&&h.at<to)out.push({r:r,at:h.at,state:"done",doneAt:h.doneAt});
    });
    if(r.done)return;
    var t=r.due,first=true,guard=0;
    while(t!=null&&t<to&&guard<500){
      if(t>=from)out.push({r:r,at:t,state:first?(t<=n?"overdue":"upcoming"):"future",current:first});
      if(r.repeat==="none")break;
      t=nextOcc(t,r.repeat,r.anchorDay);first=false;guard++;
    }
  });
  out.sort(function(a,b){return a.at-b.at});
  return out;
}
function active(){return S.reminders.filter(function(r){return !r.done})}
function overdueList(){var n=Date.now();return active().filter(function(r){return r.due<=n}).sort(function(a,b){return a.due-b.due})}

/* ---------- işlemler ---------- */
function confirmDone(id){
  var r=find(id); if(!r||r.done)return;
  var n=Date.now();
  r.history=(r.history||[]).concat([{at:r.due,doneAt:n}]).slice(-60);
  if(r.repeat==="none"){r.done=true;r.doneAt=n}
  else{var d=r.due;do{d=nextOcc(d,r.repeat,r.anchorDay)}while(d<=n);r.due=d}
  r.lastAlert=null;
  ui.alarmQ=ui.alarmQ.filter(function(x){return x!==id});
  if(LN){var ids=[];for(var k=0;k<CHAIN;k++)ids.push({id:r.nid*100+k});LN.removeDeliveredNotifications({notifications:ids}).catch(function(){})}
  save();
  if(ui.alarmId===id)nextAlarm();
  render();
  toast(r.repeat==="none"?"Tamamlandı":"Tamamlandı · sıradaki: "+fullWhen(r.due));
}
function handleAction(actionId,rid){
  if(!ui.loaded){queuedActions.push([actionId,rid]);return}
  var r=find(rid); if(!r||r.done)return;
  if(actionId==="done")confirmDone(rid);
  else enqueue(rid,true);
}

/* ---------- alarm ---------- */
function tick(){
  var n=Date.now(),I=intervalMs(),changed=false;
  active().forEach(function(r){
    if(r.due<=n&&(r.lastAlert==null||n-r.lastAlert>=I-1000)){r.lastAlert=n;changed=true;enqueue(r.id)}
  });
  if(changed){persist();render()}
  var tk=dayKey(n);
  if(tk!==ui.todayKey){if(ui.sel===ui.todayKey)ui.sel=tk;ui.todayKey=tk;var d=new Date();ui.y=d.getFullYear();ui.m=d.getMonth();render()}
  renderHeader();
}
function enqueue(id,silent){
  if(ui.alarmQ.indexOf(id)<0)ui.alarmQ.push(id);
  var r=find(id);
  if(!NATIVE){
    try{if("Notification" in window&&Notification.permission==="granted"&&document.visibilityState!=="visible")
      new Notification("Hatırlatma: "+r.title,{body:r.note||"Zamanı geldi",tag:r.id,requireInteraction:true})}catch(e){}
  }
  if(ui.alarmId==null)showAlarm(silent);
}
function showAlarm(silent){
  while(ui.alarmQ.length&&(!find(ui.alarmQ[0])||find(ui.alarmQ[0]).done))ui.alarmQ.shift();
  if(!ui.alarmQ.length){hideAlarm();return}
  var r=find(ui.alarmQ[0]); ui.alarmId=r.id;
  var late=Date.now()-r.due>=MIN, el=$("alarm");
  el.className="alarm"+(late?" overdue":"");
  var lateTxt=late?"Planlanan: "+fullWhen(r.due)+" · onay bekliyor":REPEAT[r.repeat]==="Bir kez"?"":REPEAT[r.repeat];
  el.innerHTML='<div class="bell">'+ICON.bell+'</div>'+
    '<div class="a-time">'+hm(r.due)+'</div>'+
    '<div class="a-title">'+esc(r.title)+'</div>'+
    (r.note?'<div class="a-note">'+esc(r.note)+'</div>':'')+
    (lateTxt?'<div class="a-meta">'+esc(lateTxt)+'</div>':'')+
    '<div class="alarm-actions">'+
      '<button class="a-done" data-act="alarmDone">'+ICON.check+'Yaptım, tamamlandı</button>'+
      '<button class="a-later" data-act="alarmLater">Şimdi değil · '+S.settings.interval+' dk sonra tekrar</button>'+
    '</div>'+
    (ui.alarmQ.length>1?'<div class="a-meta">Sırada '+(ui.alarmQ.length-1)+' hatırlatma daha var</div>':'');
  el.hidden=false;
  if(!silent&&!NATIVE)startSound();
  vibrate();
  setTimeout(function(){var b=el.querySelector(".a-done");if(b)b.focus()},50);
}
function nextAlarm(){stopSound();ui.alarmId=null;showAlarm(false)}
function hideAlarm(){stopSound();ui.alarmId=null;$("alarm").hidden=true}
function vibrate(){try{navigator.vibrate&&navigator.vibrate([500,250,500,250,800])}catch(e){}}

var actx=null,soundTimer=null;
function ensureAudio(){
  try{if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(AC)actx=new AC()}
  if(actx&&actx.state==="suspended")actx.resume()}catch(e){}
}
function burst(){
  if(!actx)return;
  var t0=actx.currentTime+0.02;
  [[0,880],[0.2,1318],[0.4,880],[0.6,1318]].forEach(function(p){
    var o=actx.createOscillator(),g=actx.createGain();
    o.type="triangle";o.frequency.value=p[1];
    g.gain.setValueAtTime(0.0001,t0+p[0]);
    g.gain.exponentialRampToValueAtTime(0.5,t0+p[0]+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+p[0]+0.17);
    o.connect(g);g.connect(actx.destination);o.start(t0+p[0]);o.stop(t0+p[0]+0.19);
  });
}
function startSound(){
  stopSound(); if(!S.settings.sound)return; ensureAudio(); burst();
  var n=0; soundTimer=setInterval(function(){if(++n>40){stopSound();return}burst()},1500);
}
function stopSound(){if(soundTimer){clearInterval(soundTimer);soundTimer=null}}

/* ---------- Android bildirimleri ---------- */
var syncT=null;
function scheduleSync(){if(!LN)return;clearTimeout(syncT);syncT=setTimeout(syncNative,400)}
function syncNative(){
  if(!LN)return Promise.resolve();
  return LN.getPending().then(function(p){
    var list=(p&&p.notifications)||[];
    return list.length?LN.cancel({notifications:list.map(function(x){return {id:x.id}})}):null;
  }).then(function(){
    var n=Date.now(),I=intervalMs(),out=[];
    active().sort(function(a,b){return a.due-b.due}).forEach(function(r){
      var base=r.lastAlert!=null?r.lastAlert+I:r.due;
      var k0=base>n+1500?0:Math.ceil((n+1500-base)/I);
      for(var k=0;k<CHAIN&&out.length<400;k++){
        var idx=k0+k,first=(r.lastAlert==null&&idx===0);
        out.push({id:r.nid*100+k,
          title:first?r.title:r.title+" (tekrar)",
          body:first?(r.note||"Zamanı geldi. Hallettiysen “Yaptım” de."):"Hâlâ onay bekliyor. Hallettiysen “Yaptım” de.",
          schedule:{at:new Date(base+idx*I),allowWhileIdle:true},
          channelId:CHANNEL,actionTypeId:"HATIRLATMA",extra:{rid:r.id},
          smallIcon:"ic_stat_bell",iconColor:"#0E6E62",autoCancel:true});
      }
    });
    return out.length?LN.schedule({notifications:out}):null;
  }).catch(function(e){console.warn("bildirim planlama",e)});
}
function nativeInit(){
  if(!LN)return Promise.resolve();
  LN.addListener("localNotificationActionPerformed",function(ev){
    var n=ev&&ev.notification;handleAction(ev.actionId,n&&n.extra&&n.extra.rid);
  });
  LN.addListener("localNotificationReceived",function(n){
    var rid=n&&n.extra&&n.extra.rid,r=find(rid);
    if(r&&!r.done){r.lastAlert=Date.now();persist();enqueue(rid,true);render()}
  });
  return LN.createChannel({id:CHANNEL,name:"Hatırlatmalar",description:"Zamanı gelen hatırlatmalar",
      importance:5,visibility:1,sound:"alarm.wav",vibration:true,lights:true,lightColor:"#0E6E62"})
    .catch(function(){})
    .then(function(){return LN.registerActionTypes({types:[{id:"HATIRLATMA",actions:[{id:"done",title:"Yaptım ✓"}]}]})})
    .catch(function(){})
    .then(refreshPerms);
}
function refreshPerms(ask){
  if(!LN)return Promise.resolve();
  return LN.checkPermissions().then(function(p){
    if(p.display!=="granted"&&ask!==false)return LN.requestPermissions();return p;
  }).then(function(p){ui.perm=p.display}).catch(function(){})
  .then(function(){return LN.checkExactNotificationSetting?LN.checkExactNotificationSetting():null})
  .then(function(x){if(x)ui.exact=x.exact_alarm}).catch(function(){})
  .then(function(){if(ui.sheet==="settings")renderSettings();render()});
}

  var t=$("fTitle");if(t)e.title=t.value;
  var d=$("fDate");if(d)e.date=d.value;
  var h=$("fTime");if(h)e.time=h.value;
  var n=$("fNote");if(n)e.note=n.value;
}
function submitEdit(){
  readForm();var e=ui.edit;
  if(!e.title.trim()){e.err="Bir başlık yaz.";renderEdit();$("fTitle").focus();return}
  if(!e.date||!e.time){e.err="Tarih ve saat seç.";renderEdit();return}
  var p=e.date.split("-"),q=e.time.split(":");
  var due=new Date(+p[0],+p[1]-1,+p[2],+q[0],+q[1],0,0).getTime();
  var r=e.id?find(e.id):null,isNew=!r;
  if(isNew){r=mk({due:due});S.reminders.push(r)}
  var dueChanged=r.due!==due;
  r.title=e.title.trim();r.note=e.note.trim();r.repeat=e.repeat;r.due=due;r.anchorDay=new Date(due).getDate();
  if(dueChanged||isNew){r.lastAlert=null;if(r.done&&due>Date.now()){r.done=false;r.doneAt=null}}
  if(r.done&&r.repeat!=="none"){r.done=false;r.doneAt=null;var d=r.due;while(d<=Date.now())d=nextOcc(d,r.repeat,r.anchorDay);r.due=d}
  save();closeSheet();
  ui.sel=dayKey(r.due);var dd=new Date(r.due);ui.y=dd.getFullYear();ui.m=dd.getMonth();
  render();
  var rl=rel(r.due);
  toast((isNew?"Eklendi":"Kaydedildi")+" · "+fullWhen(r.due)+(rl&&r.due>Date.now()?" ("+rl+")":""));
}
function quick(q){
  readForm();var e=ui.edit,d=new Date();
  if(q==="30"||q==="60"){d=new Date(Date.now()+(+q)*MIN);d.setSeconds(0,0)}
  else if(q==="eve"){d.setHours(20,0,0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+1)}
  else if(q==="tom"){d.setDate(d.getDate()+1);d.setHours(9,0,0,0)}
  e.date=dayKey(d);e.time=hm(d.getTime());e.err="";renderEdit();
}

/* ---------- ayarlar ---------- */
function renderSettings(){
  var s=S.settings;
  function opt(name,val,label,extra){return '<button type="button" data-act="set" data-k="'+name+'" data-v="'+val+'" aria-pressed="'+(String(s[name])===String(val))+'"'+(extra||"")+'>'+label+'</button>'}
  var notif;
  if(NATIVE){
    notif='<div class="status-line"><span>Bildirim izni</span>'+(ui.perm==="granted"?'<span class="ok-txt">Açık</span>':'<button class="pill-btn" data-act="askPerm">İzin ver</button>')+'</div>'+
      '<div class="status-line"><span>Tam zamanında çalma</span>'+(ui.exact==="denied"?'<button class="pill-btn" data-act="exact">Ayarı aç</button>':'<span class="ok-txt">Açık</span>')+'</div>'+
      '<p class="hint" style="margin:0">Telefon kilitliyken ve uygulama kapalıyken de bildirim gelir. Onaylamazsan bildirim her '+s.interval+' dakikada bir, 3 saat boyunca tekrarlar; uygulamayı açtığında zincir yenilenir. Telefon sessiz moddaysa yalnızca titrer.</p>';
  }else{
    var can="Notification" in window,perm=can?Notification.permission:"yok";
    notif='<p class="hint" style="margin:0">Bu web sürümü yalnızca sayfa açıkken sesli uyarı verir. Telefon kilitliyken de çalması için Android uygulamasını kur.</p>'+
      (can&&perm!=="granted"?'<div class="status-line"><span>Tarayıcı bildirimi</span><button class="pill-btn" data-act="webPerm">İzin iste</button></div>':'');
  }
  $("sheet").innerHTML='<div class="stack">'+
   '<div class="sheet-h"><h2>Ayarlar</h2><button class="icon-btn" data-act="closeSheet" aria-label="Kapat">'+ICON.close+'</button></div>'+
   '<div class="set-group"><span class="lbl" style="font-weight:700">Yazı boyutu</span><div class="opt">'+
     opt("size","s",'<span class="size-prev"><span style="font-size:.85rem">Aa</span> Küçük</span>')+
     opt("size","m",'<span class="size-prev"><span style="font-size:1.05rem">Aa</span> Orta</span>')+
     opt("size","l",'<span class="size-prev"><span style="font-size:1.3rem">Aa</span> Büyük</span>')+'</div></div>'+
   '<div class="set-group"><span style="font-weight:700">Onaylanmazsa tekrar uyar</span><div class="opt">'+
     opt("interval",5,"5 dk")+opt("interval",10,"10 dk")+opt("interval",15,"15 dk")+opt("interval",30,"30 dk")+'</div></div>'+
   (NATIVE?'':'<div class="set-group"><span style="font-weight:700">Uyarı sesi</span><div class="opt">'+opt("sound",true,"Açık")+opt("sound",false,"Kapalı")+'</div><button class="pill-btn" data-act="testSound" style="align-self:flex-start">Sesi dene</button></div>')+
   '<div class="set-group"><span style="font-weight:700">Bildirimler</span>'+notif+
     '<button class="pill-btn" data-act="testReminder" style="align-self:flex-start">1 dakika sonrasına deneme hatırlatması kur</button></div>'+
   '<div class="set-group"><span style="font-weight:700">Yedek</span><p class="hint" style="margin:0">Veriler bu cihazda saklanır. Telefon değiştirirken yedeği kopyalayıp yeni cihazda geri yükleyebilirsin.</p>'+
     '<textarea class="inp" id="bk" placeholder="Geri yüklemek için yedek metnini buraya yapıştır" style="min-height:3.5rem;font-size:.8rem"></textarea>'+
     '<div class="btn-row"><button class="btn ghost" data-act="bkCopy">Yedeği kopyala</button><button class="btn ghost'+(ui.bkArmed?' danger armed':'')+'" data-act="bkLoad">'+(ui.bkArmed?'Evet, mevcut verinin yerine yükle':'Geri yükle')+'</button></div></div>'+
   '<p class="hint" style="margin:0;text-align:center">Zamanında · '+(NATIVE?"Android":"Web")+' sürümü · '+S.reminders.length+' kayıt</p>'+
  '</div>';
}
function openSheet(){$("sheetWrap").hidden=false;document.body.style.overflow="hidden"}
function closeSheet(){$("sheetWrap").hidden=true;document.body.style.overflow="";ui.sheet=null;ui.edit=null;ui.bkArmed=false}

var toastT=null;
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

/* ---------- olaylar ---------- */
document.addEventListener("pointerdown",ensureAudio,true);
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");if(!el)return;
  var a=el.getAttribute("data-act"),id=el.getAttribute("data-id");
  switch(a){
    case "view":ui.view=el.getAttribute("data-v");render();break;
    case "mprev":ui.m--;if(ui.m<0){ui.m=11;ui.y--}render();break;
    case "mnext":ui.m++;if(ui.m>11){ui.m=0;ui.y++}render();break;
    case "gotoday":var d=new Date();ui.y=d.getFullYear();ui.m=d.getMonth();ui.sel=dayKey(d);render();break;
    case "pick":ui.sel=el.getAttribute("data-d");var p=keyToDate(ui.sel);if(p.getMonth()!==ui.m){ui.m=p.getMonth();ui.y=p.getFullYear()}render();break;
    case "new":openEdit(null,ui.view==="cal"?ui.sel:null);break;
    case "newOn":openEdit(null,ui.sel);break;
    case "edit":openEdit(id);break;
    case "done":if(ui.sheet)closeSheet();confirmDone(id);break;
    case "closeSheet":closeSheet();break;
    case "rep":readForm();ui.edit.repeat=el.getAttribute("data-v");renderEdit();break;
    case "quick":quick(el.getAttribute("data-q"));break;
    case "del":
      readForm();
      if(!ui.edit.armed){ui.edit.armed=true;renderEdit();break}
      var r=find(ui.edit.id);S.reminders=S.reminders.filter(function(x){return x.id!==ui.edit.id});
      ui.alarmQ=ui.alarmQ.filter(function(x){return x!==ui.edit.id});
      save();closeSheet();render();toast("Silindi: "+(r?r.title:""));break;
    case "settings":ui.sheet="settings";renderSettings();openSheet();if(NATIVE)refreshPerms(false);break;
    case "set":
      var k=el.getAttribute("data-k"),v=el.getAttribute("data-v");
      S.settings[k]=k==="interval"?+v:k==="sound"?v==="true":v;save();render();renderSettings();break;
    case "testSound":ensureAudio();burst();vibrate();break;
    case "testReminder":
      var t=mk({title:"Deneme hatırlatması",note:"Bildirim ve ses çalışıyor mu? Kontrol için “Yaptım” de.",due:Date.now()+MIN});
      S.reminders.push(t);save();closeSheet();render();toast("Deneme hatırlatması 1 dakika sonra çalacak");break;
    case "clearSamples":
      S.reminders=S.reminders.filter(function(r){return !r.sample});ui.alarmQ=ui.alarmQ.filter(find);
      if(ui.alarmId&&!find(ui.alarmId))hideAlarm();save();render();toast("Örnekler silindi");break;
    case "askPerm":refreshPerms(true);break;
    case "exact":if(LN&&LN.changeExactNotificationSetting)LN.changeExactNotificationSetting().then(function(){refreshPerms(false)}).catch(function(){});break;
    case "webPerm":try{Notification.requestPermission().then(function(){renderSettings()})}catch(e){toast("Bu tarayıcı bildirime izin vermiyor")}break;
    case "bkCopy":
      var txt=JSON.stringify(S),ta=$("bk");
      var fb=function(){ta.value=txt;ta.focus();ta.select();toast("Yedek metni seçildi, kopyalayabilirsin")};
      try{navigator.clipboard.writeText(txt).then(function(){toast("Yedek panoya kopyalandı")},fb)}catch(e){fb()}break;
    case "bkLoad":
      var val=($("bk").value||"").trim(),obj=null;
      try{obj=JSON.parse(val)}catch(e){}
      if(!obj||!Array.isArray(obj.reminders)){toast("Yedek metni okunamadı. Tamamını yapıştırdığından emin ol.");ui.bkArmed=false;break}
      if(!ui.bkArmed){ui.bkArmed=true;renderSettings();$("bk").value=val;break}
      S.reminders=obj.reminders;S.nextNid=obj.nextNid||obj.reminders.length+1;
      for(var sk in (obj.settings||{}))S.settings[sk]=obj.settings[sk];
      save();closeSheet();render();toast(S.reminders.length+" kayıt geri yüklendi");break;
    case "alarmDone":confirmDone(ui.alarmId);break;
    case "alarmLater":
      var rr=find(ui.alarmId);ui.alarmQ.shift();
      if(rr)toast(S.settings.interval+" dk sonra tekrar hatırlatılacak");
      nextAlarm();break;
  }
});
document.addEventListener("submit",function(ev){ev.preventDefault();if(ev.target.id==="editForm")submitEdit()});
$("sheetWrap").addEventListener("click",function(ev){if(ev.target===this)closeSheet()});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&!$("sheetWrap").hidden)closeSheet()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&ui.loaded){tick();scheduleSync();render()}});

/* ---------- başlat ---------- */
nativeInit();
load().then(function(){
  ui.loaded=true;render();
  queuedActions.splice(0).forEach(function(x){handleAction(x[0],x[1])});
  tick();scheduleSync();
  setInterval(tick,5000);
});
})();
</script>
